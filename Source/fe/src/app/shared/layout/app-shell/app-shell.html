<div class="shell">
  <app-sidebar />
  <div class="shell__main">
    <app-topbar />
    @if (billing.isTrial()) {
      <div class="shell__trial-banner">
        <span>Trial <strong>{{ billing.trialPlan() }}</strong>: còn <strong>{{ billing.trialDaysLeft() }} ngày</strong> — sau đó về Free.</span>
        <a class="shell__trial-upgrade" routerLink="/app/settings/billing">Upgrade để giữ access →</a>
      </div>
    }
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
<app-toast />
