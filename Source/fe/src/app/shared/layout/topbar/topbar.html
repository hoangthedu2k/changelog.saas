<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu-btn" (click)="layout.toggleSidebar()" aria-label="Toggle menu">
      <span class="topbar__menu-icon">☰</span>
    </button>
  </div>
  <div class="topbar__right">
    @if (currentUser(); as user) {
      <span class="topbar__email">{{ user.email }}</span>
    }
    <button class="topbar__logout" (click)="logout()">Logout</button>
  </div>
</header>
